name: ci

# Restored by ADR 0028. Runs the same targets as the local pre-push hook (ADR 0027), so a PR shows
# pass/fail on GitHub even when someone pushed with --no-verify or without core.hooksPath.
#
# Minutes budget (ADR 0028 amendment, 20 Nov 2026; GitHub Free, private repo): the pre-push hook
# already runs `make check` on every push, so CI runs ONCE per PR, not on every push:
#   - when a PR is opened (not as a draft), reopened or marked ready for review;
#   - again only on request: add the label `ci` to the PR (remove and re-add it to run again), or
#     `gh workflow run ci.yml --ref <branch>` (results attach to the branch's head commit);
#   - on pushes to main.
# The MySQL job (ADR 0039) runs only when case.db code changed (packages/ledger, gateway settings
# or main.py), with the label `ci-mysql`, or with `gh workflow run ci.yml --ref <branch> -f mysql=true`.
# The dependency audit runs only when a lock file changed; the secret scan runs every time.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      mysql:
        description: also run the ledger + gateway tests on MySQL 8 (ADR 0039)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what runs. A draft PR runs nothing; a `labeled` event runs only for the labels above.
  changes:
    name: what to run
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'ci' || github.event.label.name == 'ci-mysql'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists the PR's changed files through the API
    outputs:
      ledger: ${{ steps.f.outputs.ledger }}
      locks: ${{ steps.f.outputs.locks }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            ledger:
              - 'packages/ledger/**'
              - 'apps/gateway/src/credassure/gateway/settings.py'
              - 'apps/gateway/src/credassure/gateway/main.py'
            locks:
              - 'uv.lock'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - '**/pyproject.toml'

  python:
    name: make check (ruff, mypy, pytest incl. fuzz, bandit)
    needs: changes
    # the `ci-mysql` label runs only the MySQL job
    if: github.event.action != 'labeled' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked --all-packages
      # Types only: mypy needs the optional reranker module, not torch (pinned to uv.lock).
      - run: uv pip install --no-deps "sentence-transformers==6.2.0"
      - name: Rebuild the gitignored HR store from frozen profiles
        run: make hr-db
      - run: make check
      - name: No breaking API change against the base branch (scope #28)
        if: github.event_name == 'pull_request'
        run: make openapi-diff BASE=origin/${{ github.base_ref }}
      - name: Prompt change control (scope #36)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- '*/prompts/*'; then
            make eval-fast PROMPTS_BASE=origin/${{ github.base_ref }}
          else
            echo "No prompt changes"
          fi

  mysql:
    name: ledger + gateway tests on MySQL 8 (ADR 0039)
    needs: changes
    if: >-
      needs.changes.outputs.ledger == 'true' ||
      github.event.label.name == 'ci-mysql' || inputs.mysql == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-root-pw"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CREDASSURE_TEST_MYSQL_URL: mysql+pymysql://root:ci-root-pw@127.0.0.1:3306/ca
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked --all-packages
      - name: Rebuild the gitignored HR store from frozen profiles
        run: make hr-db
      - run: uv run pytest packages/ledger apps/gateway tests -q -p no:cacheprovider

  audit:
    name: dependency audit + secret scan
    needs: changes
    if: github.event.action != 'labeled' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the PR's commits through the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pip-audit and the SBOM only change when a lock file does (main always runs them)
      - if: needs.changes.outputs.locks == 'true' || github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v5
      - if: needs.changes.outputs.locks == 'true' || github.event_name != 'pull_request'
        run: uv python install 3.12
      - if: needs.changes.outputs.locks == 'true' || github.event_name != 'pull_request'
        run: uv sync --locked --all-packages
      - if: needs.changes.outputs.locks == 'true' || github.event_name != 'pull_request'
        run: make audit
      - if: needs.changes.outputs.locks == 'true' || github.event_name != 'pull_request'
        run: make sbom  # scope #41: CycloneDX SBOM from the lock files
      - if: needs.changes.outputs.locks == 'true' || github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: var/release/sbom.cdx.json
          retention-days: 30
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: web (typecheck, vitest, build)
    needs: changes
    if: github.event.action != 'labeled' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists the PR's changed files through the API
    steps:
      - uses: actions/checkout@v4
      # Only web-relevant changes build the web app (docs/help feeds the in-app help, openapi.json the client).
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/api-client/**'
              - 'docs/help/**'
              - 'openapi.json'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
      - if: steps.changed.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22   # vitest 5 needs Node >= 22.12
          cache: npm
      - if: steps.changed.outputs.web == 'true'
        run: npm ci
      - if: steps.changed.outputs.web == 'true'
        run: npm run typecheck -w apps/web
      - if: steps.changed.outputs.web == 'true'
        run: npm run test -w apps/web
      - if: steps.changed.outputs.web == 'true'
        run: npm run build -w apps/web
      - if: steps.changed.outputs.web == 'true'
        run: npm run budget -w apps/web  # U6: initial JS ≤ 250 kB gzip per route
      - if: steps.changed.outputs.web != 'true'
        run: echo "No web-relevant changes; web build skipped"
