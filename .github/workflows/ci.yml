name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked --all-packages
      - run: make check
      - name: No breaking API change against main (scope #28)
        if: github.event_name == 'pull_request'
        run: |
          git show origin/${{ github.base_ref }}:openapi.json > /tmp/base-openapi.json
          # ponytail: unpinned image; Phase 12 (#41) pins every image by digest
          docker run --rm -v /tmp:/base -v "$PWD":/head tufin/oasdiff \
            breaking /base/base-openapi.json /head/openapi.json --fail-on ERR
      - run: make audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
