[project]
name = "credassure-gateway"
version = "0.1.0"
description = "FastAPI composition root: the only public API (ADR 0005)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "credassure-agent-critic",
    "credassure-agent-copilot",
    "credassure-agent-lendwise",
    "credassure-agent-onboarding",
    "credassure-agent-supervisor",
    "credassure-agent-working-capital",
    "credassure-engines",
    "credassure-observability",
    "credassure-tools",
    "credassure-llm",
    "credassure-ledger",
    "credassure-guardrails",
    "credassure-security",
    "credassure-lender-sim",
    "credassure-reports",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.55",
    "langfuse>=5,<6",
    "httpx>=0.27",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "python-multipart>=0.0.18",
    "limits>=3.13",
    "openpyxl>=3.1",  # Excel case workbook import (ADR 0040)
    "defusedxml>=0.7",  # openpyxl parses untrusted XML through it when installed
    "pypdf>=5.0",  # ADR 0041: text layer of lender PDFs
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.3"]

[tool.uv.sources]
credassure-agent-critic = { workspace = true }
credassure-agent-copilot = { workspace = true }
credassure-agent-lendwise = { workspace = true }
credassure-agent-onboarding = { workspace = true }
credassure-agent-supervisor = { workspace = true }
credassure-agent-working-capital = { workspace = true }
credassure-engines = { workspace = true }
credassure-lender-sim = { workspace = true }
credassure-observability = { workspace = true }
credassure-tools = { workspace = true }
credassure-llm = { workspace = true }
credassure-ledger = { workspace = true }
credassure-guardrails = { workspace = true }
credassure-security = { workspace = true }
credassure-reports = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
