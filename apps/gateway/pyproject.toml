[project]
name = "credassure-gateway"
version = "0.1.0"
description = "FastAPI composition root: the only public API (ADR 0005)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "credassure-agent-critic",
    "credassure-agent-copilot",
    "credassure-agent-lendwise",
    "credassure-agent-onboarding",
    "credassure-agent-supervisor",
    "credassure-agent-working-capital",
    "credassure-observability",
    "credassure-tools",
    "credassure-llm",
    "credassure-ledger",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.55",
    "langfuse>=5,<6",
    "httpx>=0.27",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.3"]

[tool.uv.sources]
credassure-agent-critic = { workspace = true }
credassure-agent-copilot = { workspace = true }
credassure-agent-lendwise = { workspace = true }
credassure-agent-onboarding = { workspace = true }
credassure-agent-supervisor = { workspace = true }
credassure-agent-working-capital = { workspace = true }
credassure-observability = { workspace = true }
credassure-tools = { workspace = true }
credassure-llm = { workspace = true }
credassure-ledger = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
