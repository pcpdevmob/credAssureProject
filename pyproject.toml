[project]
name = "credassure"
version = "0.1.0"
description = "CredAssure monorepo root (uv workspace, ADR 0005)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "credassure-gateway",
    "credassure-observability",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pre-commit>=4",
    "import-linter>=2.1",
    "types-pyyaml>=6",
    "numpy-financial>=1.0",  # evaluation/gold only, never imported by packages/engines
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/gateway",
    "agents/supervisor",
    "agents/onboarding",
    "agents/working-capital",
    "agents/lendwise",
    "agents/critic",
    "agents/copilot",
    "packages/core",
    "packages/engines",
    "packages/ledger",
    "packages/llm",
    "packages/observability",
    "packages/reports",
    "packages/retrieval",
    "packages/security",
    "packages/tools",
    "packages/lender-sim",
    "evaluation",
    "data/generators",
]

[tool.uv.sources]
credassure-gateway = { workspace = true }
credassure-observability = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "prompts", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]

[tool.ruff.lint.isort]
known-first-party = ["credassure"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "N802"]
# Generated document text (Markdown tables, policy prose) is kept on one line per row.
"data/generators/src/credassure/datagen/kfs.py" = ["E501"]
"data/generators/src/credassure/datagen/policies.py" = ["E501"]
"data/generators/src/credassure/datagen/harvest.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
mypy_path = [
    "apps/gateway/src",
    "agents/supervisor/src",
    "agents/onboarding/src",
    "agents/working-capital/src",
    "agents/lendwise/src",
    "agents/critic/src",
    "agents/copilot/src",
    "packages/core/src",
    "packages/engines/src",
    "packages/ledger/src",
    "packages/llm/src",
    "packages/observability/src",
    "packages/reports/src",
    "packages/retrieval/src",
    "packages/security/src",
    "packages/tools/src",
    "packages/lender-sim/src",
    "evaluation/src",
    "data/generators/src",
]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["apps", "agents", "packages", "evaluation", "data/generators", "tests"]
markers = ["slow: excluded from make check-fast"]

[tool.bandit]
exclude_dirs = ["tests"]
