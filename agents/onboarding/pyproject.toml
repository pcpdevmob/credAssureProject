[project]
name = "credassure-agent-onboarding"
version = "0.2.0"
description = "Gate 1 readiness: role, training, policy acknowledgement."
requires-python = ">=3.12,<3.13"
dependencies = [
    "credassure-core",
    "credassure-engines",
    "fastapi>=0.115",
]

[tool.uv.sources]
credassure-core = { workspace = true }
credassure-engines = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
