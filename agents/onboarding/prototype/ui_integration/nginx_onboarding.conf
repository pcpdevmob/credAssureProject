# Add inside the existing `server { ... }` block of the FinBridge site, next to the
# /api/auth/ and /api/users/ locations. Then:  sudo nginx -t && sudo systemctl reload nginx
# Assumes the team backend (or readiness.demo_app) runs on 127.0.0.1:8000.
location /api/agents/ {
    proxy_pass         http://127.0.0.1:8000;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   Authorization $http_authorization;
    proxy_read_timeout 90s;      # a model rewording can take a few seconds
}
