name: copilot
version: "0.2.0"
owner: "Adesh"  # retrieval with Tejas; corpus Tejas and Pritish
requirement_ids: [CP-01, CP-02, CP-03, BR-15, SUP-08]
scope_items: [2, 20, 40]
tools: [search_regulations, search_policies, get_case_facts, explain_blocker, verify_claims]
readable_data:
  - "corpus: public (search_regulations); policy + this case's own uploaded KFS (search_policies)"
  - "ledger: onb.gate, wc.*, lw.*, ver.* (read); cp.* (write: answer records)"
  - "chat_messages: this user's redacted turns in this case"
gate: "none (on demand, never a stage); refusals in code; every model answer passes the Critic or is ABSTAIN"
prompts: [cp_tool, cp_answer]
