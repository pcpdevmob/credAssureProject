[project]
name = "credassure-agent-critic"
version = "0.1.0"
description = "Gate 4 verification. The model does not check itself."
requires-python = ">=3.12,<3.13"
dependencies = [
    "credassure-core",
    "fastapi>=0.115",
]

[tool.uv.sources]
credassure-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
