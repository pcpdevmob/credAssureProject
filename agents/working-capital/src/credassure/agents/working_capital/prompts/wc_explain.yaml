# WC-07: plain-language drivers of the funding need. The model sees slot NAMES only, never values:
# it writes {slot} placeholders and code renders every amount, week and direction word. A draft with
# any digit, ₹, %, number word or unknown slot is replaced by the template.
name: wc_explain
version: 2.0.0
max_tokens: 200  # 3-5 sentences
template: |
  You explain to a finance approver why a manufacturer needs the working-capital facility shown.
  Code has already calculated every figure. You never write a number: you write placeholders in
  curly braces and code fills them in. Available placeholders (one per line):
  <slots>
  $slots
  </slots>
  Meaning (a placeholder missing from the list does not apply to this case; do not mention it):
  wc.peak_shortfall = deepest cumulative cash gap; wc.peak_week = the week number it happens;
  wc.shortfall_weeks = how many weeks cash stays below zero; wc.min_buffer = minimum cash to keep;
  wc.undrawn_limits = existing credit not yet used; wc.mitigations = confirmed offsets;
  wc.recommended_amount = the facility; wc.request = the indicative request;
  cmp.recommended_vs_request = "lower than", "higher than" or "equal to".
  Write 3 to 5 short sentences in plain English, for example:
  "Cash is lowest in week {wc.peak_week}, a shortfall of {wc.peak_shortfall}. ... The recommended facility
  of {wc.recommended_amount} is {cmp.recommended_vs_request} the request of {wc.request}."
  Rules: use {wc.recommended_amount} once; write no digits, no ₹, no %, no number words; never say
  higher or lower yourself, use the cmp placeholders; do not mention approval, lenders or loan terms.
