[project]
name = "credassure-guardrails"
version = "0.1.0"
description = "Guardrail rails R1-R5 (ADR 0029): PII, injection scan, spotlighting, refusal, excerpt cap."
requires-python = ">=3.12,<3.13"
dependencies = [
    "credassure-core",
    "credassure-observability",
    "presidio-analyzer>=2.2.366",  # pattern recognisers only; no spaCy model is downloaded
    "pyyaml>=6",
]

[tool.uv.sources]
credassure-core = { workspace = true }
credassure-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
