[project]
name = "credassure-tools"
version = "0.1.0"
description = "Tool registry and the data-access matrix (scope #24)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "credassure-core",
    "pyyaml>=6.0",
]

[tool.uv.sources]
credassure-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
