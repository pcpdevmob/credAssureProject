[project]
name = "credassure-ledger"
version = "0.1.0"
description = "Fact ledger and hash-chained audit. Only this package writes them (ADR 0005)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pyyaml>=6",
    "credassure-security",
]

[tool.uv.sources]
credassure-security = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
