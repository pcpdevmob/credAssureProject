[project]
name = "credassure-llm"
version = "0.1.0"
description = "The only package that imports the OpenAI SDK (ADR 0005)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "credassure-core",
    "credassure-security",
    "httpx2>=2",  # the openai SDK's transport; tests mock it
    "openai>=1.55",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[tool.uv.sources]
credassure-core = { workspace = true }
credassure-security = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
