[project]
name = "credassure-llm"
version = "0.1.0"
description = "The only package that imports the OpenAI SDK (ADR 0005)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
