[project]
name = "credassure-core"
version = "0.1.0"
description = "Shared contract and ports (design-detail 2.1, scope #46)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
