# Real Indian corpus sources (ADR 0019, docs/data/DATA_RESOURCES.md "Corpus sources"). Metadata only.
# method: script = harvest index pages (robots.txt, 1 req/s, stop host on 403/429/418/challenge), rest manual.
#         manual = never fetched by script; slots go to MANUAL_DOWNLOADS.md.
# Index pages were read on 2026-11-05. Source 1 index moved to BS_ViewMasterDirections.aspx (old /web/rbi/.../master-directions 404s). Notes record what a reader saw (status, JS-only pager, block).
version: 1
manual_hosts:   # always manual (owner decision, ADR 0019)
  - rbi.org.in
  - www.rbi.org.in
  - website.rbi.org.in
  - egazette.gov.in
  - incometaxindia.gov.in
  - www.incometaxindia.gov.in
  - indiacode.nic.in
  - www.indiacode.nic.in
sources:
  - id: 1
    name: RBI Master Directions (2025 consolidation)
    prefix: R-RBI-MD
    target: 48
    basis: L4
    applies_to: all          # per document: owner sets commercial_bank / nbfc / sfb / coop_bank when filling a slot
    jurisdiction: [IN]
    agents: [All]
    method: manual
    index_urls: ["https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx"]
  - id: 2
    name: RBI circulars superseded by the 2025 consolidation (set superseded_by)
    manual_recipe: "RBI Notifications (https://www.rbi.org.in/Scripts/NotificationUser.aspx): use the year filter for 2015-2025 and open circulars on lending to MSMEs, Key Facts Statement, interest rates on advances / external benchmark, fair practices code, or loans and advances that the 28 Nov 2025 consolidation repealed (the new Master Direction lists them in its repeal annex). Save the circular page as Web page, HTML only; set superseded_by to the matching R-RBI Direction."
    prefix: R-RBI-HIST
    target: 40
    basis: L4
    applies_to: all
    jurisdiction: [IN]
    agents: [Copilot]
    method: manual
    index_urls: ["https://www.rbi.org.in/Scripts/NotificationUser.aspx"]
  - id: 3
    name: RBI FAQs, lending-rate releases (24 months), MSME press releases, Bulletin/Annual Report chapters
    prefix: R-RBI-FAQ
    target: 14
    basis: L4
    applies_to: all
    jurisdiction: [IN]
    agents: [LendWise, WC, Copilot]
    method: manual
    index_urls: ["https://www.rbi.org.in/scripts/FS_FAQs.aspx?Id=84"]
    note: "monthly Lending and Deposit Rates releases dropped 2026-11-14 (target 36 -> 14): the press-release archive is a form with no stable per-release link, and repeated saves captured the archive list. Reference rates come from data/reference/reference_rates.yaml (R-RATE-02)."
  - id: 4
    name: CGTMSE circulars, scheme guidelines, fee pages
    prefix: R-CG-C
    target: 163
    min_date: "2015-01-01"   # owner: circulars from 2015 onward only (year from the table row; else checked on download)
    buffer: 20   # scheme/FAQ pages and scheme documents (2026-11-05 discovery of the cgtmse.in menus)
    basis: L4
    applies_to: all
    jurisdiction: [IN]
    agents: [LendWise, Copilot]
    method: script
    index_urls:
      - "https://www.cgtmse.in/Circulars"
      - {url: "https://www.cgtmse.in/", pattern: '(?:/Home/VS/(?:47|50|55|56|57|71|72|9[4-9]|10[0-2])$|/Default/ViewFile/\?id=\d+_[^"&]+&(?:amp;)?path=Page)'}
    link_pattern: '/Default/ViewFile/\?id=\d+_[^"&]+&(?:amp;)?path=Circular'
    form_pages: {field: pageNo, last: 29}   # the page's own <form method="post"> pager (no JS, same headers)
    note: "200; plain anchors, 10 rows per page; pages 2-29 via the page's HTML form field pageNo"
  - id: 5
    name: NCGTC schemes (ECLGS, CGFMU, CGSSI) guidelines and FAQs
    prefix: R-NCGTC
    target: 0
    basis: L4
    applies_to: all
    jurisdiction: [IN]
    agents: [LendWise, Copilot]
    method: script
    index_urls: ["https://www.ncgtc.in/"]
    link_pattern: '[^"]+\.pdf'
    note: "502 Bad Gateway on 2026-11-05"
  - id: 6
    name: MUDRA / PMMY circulars and FAQs
    prefix: R-MUDRA
    target: 0
    basis: L4
    applies_to: all
    jurisdiction: [IN]
    agents: [Copilot]
    method: script
    index_urls: ["https://www.mudra.org.in/"]
    link_pattern: '[^"]+\.pdf'
    note: "TLS certificate chain error on 2026-11-05; never bypassed"
  - id: 7
    name: Ministry of MSME annual reports and scheme guidelines; Udyam and MSME Samadhaan FAQs
    manual_recipe: "Replacement for a dead link (the Udyam reverse-graduation circular now redirects to FileNotFound). Pick one English, text-layer PDF linked from the Udyam site (https://udyamregistration.gov.in/, Important to know / circulars and notifications), e.g. a circular on Udyam classification, Udyam Assist or MSME status; or an English Ministry of MSME scheme guideline. Save it in a browser as raw/R-MSME-G-NNN.pdf and fill title, source_url (the PDF itself) and effective_from."
    prefix: R-MSME-G
    target: 9
    basis: L4
    applies_to: all
    jurisdiction: [IN]
    agents: [WC, Copilot]
    method: script
    index_urls: ["https://udyamregistration.gov.in/"]   # msme.gov.in returns 403 to scripts and readers (2026-11-05)
    link_pattern: '/docs/[^"]+\.pdf'
    note: "msme.gov.in 403 on 2026-11-05; Udyam homepage lists bulletins under /docs/"
  - id: 8
    name: Gazette notifications (MSME classification, GST rate/exemption, DPDP Rules, MCA MSME Form 1)
    prefix: R-GZ
    target: 10
    basis: L2
    applies_to: all
    jurisdiction: [IN]
    agents: [WC, LendWise, Onboarding]
    method: manual
    index_urls: ["https://egazette.gov.in/"]
  - id: 9
    name: CBIC GST circulars and FAQs on financial services; GST Council press releases
    prefix: R-GST-C
    target: 30
    buffer: 70   # CBIC homepage PDFs (~25), GST Council meeting agendas/minutes (~6 pages) and advisories
    basis: L4
    applies_to: all
    jurisdiction: [IN]
    agents: [LendWise, Copilot]
    method: script
    index_urls:
      - "https://gstcouncil.gov.in/press-release"
      - "https://gstcouncil.gov.in/"
      - {url: "https://cbic-gst.gov.in/", pattern: '(?:^|/)pdf/[^"]+\.pdf'}
      - "https://gstcouncil.gov.in/en/circularsadvisory"
      - {url: "https://gstcouncil.gov.in/en/gst-council-meeting?page=0", pattern: '/sites/default/files/(?:Agenda|Minutes)/[^"]+\.pdf'}
      - {url: "https://gstcouncil.gov.in/en/gst-council-meeting?page=1", pattern: '/sites/default/files/(?:Agenda|Minutes)/[^"]+\.pdf'}
      - {url: "https://gstcouncil.gov.in/en/gst-council-meeting?page=2", pattern: '/sites/default/files/(?:Agenda|Minutes)/[^"]+\.pdf'}
      - {url: "https://gstcouncil.gov.in/en/gst-council-meeting?page=3", pattern: '/sites/default/files/(?:Agenda|Minutes)/[^"]+\.pdf'}
      - {url: "https://gstcouncil.gov.in/en/gst-council-meeting?page=4", pattern: '/sites/default/files/(?:Agenda|Minutes)/[^"]+\.pdf'}
      - {url: "https://gstcouncil.gov.in/en/gst-council-meeting?page=5", pattern: '/sites/default/files/(?:Agenda|Minutes)/[^"]+\.pdf'}
    link_pattern: '(?:/sites/default/files/\d{4}-\d{2}/|(?:^|/)pdf/)[^"]+\.pdf'
  - id: 10
    name: CBDT on s.43B(h) and Income-tax Act 2025 s.37(2)(g); relevant Act chapters
    manual_recipe: "Replacement for a rejected scan (the MSME Samadhaan copy of the MSMED Act 2006 has no text layer). Preferred: a text-layer PDF of the full Micro, Small and Medium Enterprises Development Act, 2006 from India Code (https://www.indiacode.nic.in/, search the Act title and save the Act PDF). Otherwise: a CBDT circular or FAQ on section 43B(h) / Income-tax Act 2025 section 37(2)(g) from https://www.incometaxindia.gov.in/ (Communications > Circulars). Save in a browser; both hosts are manual only (ADR 0020)."
    prefix: R-TAX-C
    target: 2
    basis: L3
    applies_to: all
    jurisdiction: [IN]
    agents: [WC, Copilot]
    method: manual
    index_urls: ["https://www.incometaxindia.gov.in/", "https://www.indiacode.nic.in/"]
  - id: 11
    name: SIDBI publications and MSME Pulse reports
    prefix: R-SIDBI-P
    target: 20
    buffer: 20   # MSME Pulse edition pages
    basis: L4
    applies_to: all
    jurisdiction: [IN]
    agents: [WC, Copilot]
    method: script
    index_urls:
      - "https://sidbi.in/en/publication-and-reports"
      - {url: "https://sidbi.in/en/msme-pulse", pattern: '/head/uploads/msmepluse_documents/[^"]+\.pdf', follow: '/en/msme-pulse-(?:edition/[A-Za-z]+-\d{4}|all-edition)'}
    link_pattern: '(?:/uploads/[^"]+\.pdf|/en/msme-[a-z-]+)'
    note: "DAKSHATA/SANKALP downloads are javascript: links, so manual"
  - id: 12
    name: TReDS - RBI directions and platform FAQs/rulebooks (RXIL, M1xchange, Invoicemart)
    prefix: R-TREDS
    target: 11
    basis: L4
    applies_to: all
    jurisdiction: [IN]
    agents: [Copilot]
    method: script
    index_urls: ["https://www.m1xchange.com/faqs/", "https://www.rxil.in/"]
    link_pattern: '/wp-content/uploads/\d{4}/\d{2}/[^"]+\.pdf'
    include_index: ["https://www.m1xchange.com/faqs/", "https://www.invoicemart.com/faq"]
    note: "rxil.in returned 444 on 2026-11-05"
  - id: 13
    name: Bank and NBFC schedules of charges and sample KFS (~20 lenders, current and older)
    prefix: R-BANK-S
    target: 36
    buffer: 40   # every schedule of charges listed on bandhan.bank.in; other lenders' pages were not reachable in plain HTML
    basis: L4
    applies_to: commercial_bank   # per lender type; NBFC/SFB/co-op entries set their own
    jurisdiction: [IN]
    agents: [LendWise, Copilot]
    method: script
    index_urls: ["https://bandhan.bank.in/rates-charges"]
    link_pattern: '/sites/default/files/\d{4}-\d{2}/[^"]*(?:[Cc]harges|KFS|[Ss]chedule|SOC|[Tt]ariff)[^"]*\.pdf'
    include_index: ["https://indianbank.bank.in/en/processing-fees/charges-for-loan-products"]
  - id: 14
    name: Lok Sabha / Rajya Sabha answers on MSME credit, CGTMSE, TReDS, delayed payments
    manual_recipe: "sansad.in Questions and Answers (Lok Sabha: https://sansad.in/ls/questions/questions-and-answers ; Rajya Sabha: https://sansad.in/rs/questions/questions-and-answers): the filters take numbers, not years. Lok Sabha: set Lok Sabha = XVIII (18th, constituted June 2024) and go through its sessions from I upward. Rajya Sabha: set the session to each one held from June 2024 onward (check the session dates shown on the page). Skip any answer dated after 15 Nov 2026 (AS_OF_DATE). On both sites filter Ministry = Micro, Small and Medium Enterprises or Finance, and search the subject for MSME credit, CGTMSE, TReDS, delayed payment, Samadhaan or Udyam. Open each answer and save its PDF; one answer per row."
    prefix: R-SANSAD
    target: 25
    basis: L4
    applies_to: all
    jurisdiction: [IN]
    agents: [Copilot]
    method: manual
    index_urls: ["https://sansad.in/ls/questions/questions-and-answers", "https://sansad.in/rs/questions/questions-and-answers"]
    note: "sansad.in is a JavaScript app with no HTML listing, so manual"
  - id: 15
    name: Supreme Court and High Court judgments on the MSMED Act
    manual_recipe: "Do not use the sci.gov.in judgment-date search; it only covers 30 days per search. Search by keyword instead, one CAPTCHA per search, solved by a person (ADR 0020). Supreme Court: https://scr.sci.gov.in/ (Digital SCR) with the phrase 'Micro, Small and Medium Enterprises Development Act', then 'Facilitation Council', then 'section 18' AND 'MSMED'. High Courts: https://judgments.ecourts.gov.in/ with the same phrases. Keep judgments dated 2015-2026 that decide a point on delayed payment, section 15/16 interest, a section 18 reference or arbitration, or the section 19 pre-deposit; skip orders that only list or adjourn a case. Save the official judgment PDF as raw/R-JUD-NNN.pdf and fill title (<parties>, <court>, <date>), source_url and effective_from. Well-known starting points to confirm in the search before saving: Silpi Industries v. Kerala SRTC (SC, 2021); Gujarat State Civil Supplies Corp. v. Mahakali Foods (SC, 2022); Jharkhand Urja Vikas Nigam v. State of Rajasthan (SC, 2021); Shanti Conductors v. Assam SEB (SC, 2019). The sites show a CAPTCHA when searches come quickly: space them out and save a few judgments per sitting; the source 15 target of 25 is close to met, so extra judgments are optional. Legal points only (ADR 0020)."
    prefix: R-JUD
    target: 25
    basis: L2
    applies_to: all
    jurisdiction: [IN]
    agents: [Copilot]
    method: manual
    index_urls: ["https://scr.sci.gov.in/", "https://judgments.ecourts.gov.in/"]
    note: "sci.gov.in judgment-date search covers only 30 days per search (owner report, 2026-11-14); keyword search on Digital SCR / eCourts replaces it"
  - id: 16
    name: State MSME/industrial policies - Maharashtra (home) and other states (KR-04 distractors)
    manual_recipe: "Maharashtra (home, IN-MH): di.maharashtra.gov.in refuses connections; use the MIDC policy page https://midc.maharashtra.gov.in/industrial-policies-and-incentives/ (Industrial Policy 2019 and the 2025 Industries, Investment and Services Policy PDFs). Karnataka (IN-KA): kum.karnataka.gov.in does not resolve; save the Industrial Policy 2025-30 PDF from https://investkarnataka.co.in/. Set jurisdiction accordingly. Maharashtra GRs and MIDC policies are often Marathi only; save English versions only (Marathi is excluded)."
    prefix: R-STATE
    target: 6
    basis: L4
    applies_to: all
    jurisdiction: [IN-MH, IN-MH, IN-MH, IN-MH, IN-MH, IN-GJ, IN-GJ, IN-GJ, IN-KA, IN-KA, IN-KA, IN-TN, IN-TN, IN-TN, IN-UP, IN-UP, IN-UP, IN-TS, IN-TS, IN-TS]
    agents: [Copilot]
    method: manual
    index_urls: ["https://midc.maharashtra.gov.in/industrial-policies-and-incentives/"]
    note: "di.maharashtra.gov.in refused connections on 2026-11-05 and 2026-11-11 (MH policies moved to MIDC); other states' industries department sites are found by the owner"
