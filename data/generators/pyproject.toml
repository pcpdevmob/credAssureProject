[project]
name = "credassure-datagen"
version = "0.1.0"
description = "Seeded synthetic data v1 and corpus tooling (DATA_SPEC, Phase 2). Never imports the engines."
requires-python = ">=3.12,<3.13"
dependencies = [
    "credassure-core",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pypdf>=5.0",
    "openpyxl>=3.1",
]

[tool.uv.sources]
credassure-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
