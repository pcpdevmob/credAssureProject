# CredAssure web UI (finbridge front-end, ADR 0020): static export + gateway proxy. Sign-in, MFA and sessions are the
# gateway's (ADR 0038): every /v1 call carries a bearer token the gateway checks; the static pages hold no data.
server {
    listen 80;
    listen [::]:80;
    server_name finbridge.148-230-103-29.sslip.io;   # <-- SERVER_NAME: change/add custom domain here
    location ^~ /.well-known/acme-challenge/ { root /var/www/finbridge-acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finbridge.148-230-103-29.sslip.io;   # <-- SERVER_NAME: change/add custom domain here
    ssl_certificate /etc/letsencrypt/live/finbridge.148-230-103-29.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finbridge.148-230-103-29.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/finbridge;
    index index.html;
    autoindex off;
    error_page 404 /404.html;
    # Security headers live in one snippet (deploy/nginx/security-headers.conf). A block with its own add_header
    # inherits none from here, so it must include the snippet too (tests/test_nginx_headers.py).
    include /etc/nginx/snippets/credassure-security-headers.conf;
    location /_next/static/ { expires 30d; include /etc/nginx/snippets/credassure-security-headers.conf; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ $uri/index.html =404; }
    location /v1/ { proxy_pass http://127.0.0.1:8000; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Host $host; client_max_body_size 2m; proxy_buffering off; }  # gateway; SSE needs buffering off
    location ~ ^/(dashboard|cases|case|approvals|audit|admin)(/|$) {
        include /etc/nginx/snippets/credassure-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }
}
