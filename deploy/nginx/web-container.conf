# Web container server block (P8.4, scope #52). Replaces the nginx-unprivileged default.conf so the
# compose `web` service sends the same security headers as the host proxy (finbridge.conf). Every
# block with its own add_header re-includes the snippet (tests/test_nginx_headers.py).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/snippets/credassure-security-headers.conf;
    location /_next/static/ { expires 30d; include /etc/nginx/snippets/credassure-security-headers.conf; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ $uri/index.html =404; }
}
