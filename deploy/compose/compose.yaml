# Environment profiles (scope #44): dev, test (LLM disabled, no tracing; FakeLLM in Phase 6),
# demo (replay in Phase 12, ADR 0015);
# langfuse (self-hosted tracing, ADR 0016). Ollama (ADR 0017) is on dev and demo only.
# Run from the repo root via the Makefile targets.
name: credassure

include:
  - langfuse.yaml

x-gateway: &gateway
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile.gateway
  ports: ["127.0.0.1:8000:8000"]
  volumes: [credassure_data:/app/var]
  restart: unless-stopped

x-ollama-env: &ollama-env
  LLM_BASE_URL: http://ollama:11434/v1
  EMBED_BASE_URL: http://ollama:11434/v1

services:
  ollama:
    image: ollama/ollama
    profiles: [dev, demo]
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama_models:/root/.ollama]
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mysql:
    # ADR 0039: case.db on MySQL 8 for the hosted deployment. Internal network only (no port is
    # published); the gateway reaches it as mysql:3306 with CASE_DATABASE_URL. hr.db, corpus.db and the
    # vector index stay files in credassure_data. Start with `--profile mysql`; set MYSQL_PASSWORD and
    # MYSQL_ROOT_PASSWORD in the shell or .env first.
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin  # byte-exact like SQLite; the gateway refuses anything else
      - --log-bin-trust-function-creators=ON  # the append-only triggers (OBJ-08)
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_DATABASE: credassure
      MYSQL_USER: credassure
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    profiles: [dev, demo]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    ports: ["127.0.0.1:5173:8080"]
    restart: unless-stopped

  gateway-dev:
    <<: *gateway
    profiles: [dev]
    env_file: [../../.env]
    environment: *ollama-env
    depends_on:
      ollama: {condition: service_healthy}

  gateway-test:
    <<: *gateway
    profiles: [test]
    env_file: [../env/test.env.example]

  gateway-demo:
    <<: *gateway
    profiles: [demo]
    env_file: [../env/demo.env]
    environment: *ollama-env
    depends_on:
      ollama: {condition: service_healthy}
      mysql: {condition: service_healthy, required: false}  # only with --profile mysql

  corpus:
    # Corpus fetch/import/ingest tools (ADR 0020): non-root, read-only root filesystem, no capabilities,
    # only data/corpus writable. CORPUS_CONTACT_EMAIL comes from .env. Usage: make corpus-docker-download
    profiles: [tools]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.corpus
    env_file:
      - path: ../../.env
        required: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - ../../data/corpus:/app/data/corpus

volumes:
  credassure_data:
  ollama_models:
  mysql_data:
