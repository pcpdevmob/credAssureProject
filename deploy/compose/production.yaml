# Hosted deployment for evaluators (deployment plan, docs/deployment/azure.md). One VM:
#   Caddy (HTTPS, Let's Encrypt) → web (static app) and /v1 → gateway. Only Caddy publishes ports.
# Run from the repo root on the server:
#   docker compose -f deploy/compose/production.yaml up -d --build
# Needs on the host: .env (from deploy/env/server.env.example, chmod 600), var/corpus.db,
# the vector index folder (see models-hosted.env), var/certs/course-ca.pem, data/frozen/v1/hr.db
# (make hr-db on the Mac).
# The 5 Dec demo still runs on the Mac (ADR 0036); this is the evaluators' link and its backup.
name: credassure-prod

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. credassure.sharentest.com}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway: {condition: service_healthy}
      web: {condition: service_started}
    logging: *logging

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
      args: {HOSTED: "true"}
    restart: unless-stopped
    # Later files win: the hosted model + retrieval profile, then the server's secrets.
    env_file: [../env/models-hosted.env, ../../.env]
    environment:
      # Only Caddy reaches the gateway (no published port), so its X-Forwarded-For is trusted:
      # per-user and per-IP rate limits see the real client, not Caddy.
      FORWARDED_ALLOW_IPS: "*"
      UI_ORIGINS: https://${DOMAIN}
    expose: ["8000"]
    volumes:
      - ../../var:/app/var # case.db, corpus.db, the vector index, certs, backups (uid 10001)
      - ../../data:/app/data:ro # frozen data, hr.db, reference tables, lender scripts
      - ../../scripts:/app/scripts:ro # demo_reset.py, run once with `run --rm`
      - ../../evaluation/baseline/results:/app/evaluation/baseline/results:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s # the first request also loads the embedder and reranker
    mem_limit: 10g
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args: {API_BASE: ""} # same origin: the app calls /v1 on the domain, Caddy routes it
    restart: unless-stopped
    expose: ["8080"]
    mem_limit: 256m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
