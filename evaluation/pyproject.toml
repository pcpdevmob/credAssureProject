[project]
name = "credassure-evaluation"
version = "0.1.0"
description = "Eval harness, gold and baselines. Does not import the engines."
requires-python = ">=3.12,<3.13"
dependencies = [
    "credassure-llm",
    "httpx>=0.27",
    "numpy-financial>=1.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
credassure-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credassure"]
